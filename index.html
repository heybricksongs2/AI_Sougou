<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔐 LOCK LOCKER LOCKEST 🔓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 背景パーティクル & メカニカル鍵背景 -->
  <canvas id="particle-canvas"></canvas>
  <div id="lock-mechanism-bg">
    <div class="mech-glow-burst"></div>
    <div class="mech-bolt bolt-left"></div>
    <div class="mech-bolt bolt-right"></div>
    <div class="mech-cylinder-ring outer"></div>
    <div class="mech-cylinder-ring mid"></div>
    <div class="mech-cylinder-ring inner"></div>
    <div class="mech-keyhole-shadow"></div>
  </div>
  <div id="danger-vignette"></div>
  <div id="screen-flash-overlay"></div>

  <div id="game-app">
    <!-- ヘッダーHUD -->
    <header id="hud">
      <div class="hud-item timer-box">
        <span class="hud-label">TIME</span>
        <span id="time-display" class="hud-value">18.0</span>
        <span id="time-added-anim" class="time-bonus">+1.0s</span>
      </div>
      <div class="hud-item score-box">
        <span class="hud-label">SCORE</span>
        <span id="score-display" class="hud-value">0</span>
      </div>
      <div class="hud-item unlocked-box">
        <span class="hud-label">UNLOCKED</span>
        <span id="unlocked-count" class="hud-value">0</span>
      </div>
      <div class="hud-btn-group">
        <button id="sound-btn" class="icon-btn" aria-label="Sound Toggle">🔊</button>
        <button id="debug-btn" class="icon-btn" aria-label="Debug Panel">🛠️</button>
      </div>
    </header>

    <!-- 鍵スタックエリア（立体カード構造） -->
    <main id="lock-stage">
      <!-- 背後の鍵（次の鍵：少し薄く、小さく奥にスタンバイ） -->
      <div id="next-lock-card" class="lock-card preview-card">
        <div class="card-shackle"></div>
        <div class="card-body">
          <div class="card-badge" id="next-lock-badge">NEXT</div>
        </div>
      </div>

      <!-- 手前の鍵（今解く鍵：アクティブ） -->
      <div id="current-lock-card" class="lock-card active-card">
        <div class="card-shackle" id="current-shackle"></div>
        <div class="card-body">
          <div class="lock-header">
            <span id="lock-level-badge" class="level-badge">Lv.1</span>
            <span id="lock-difficulty" class="difficulty-stars">★☆☆☆☆</span>
          </div>

          <!-- ギミック操作エリア（ピクトグラム・図形による直感UI） -->
          <div id="gimmick-container" class="gimmick-area">
            <!-- JavaScriptで言語不要の直感ギミックUIを挿入 -->
          </div>
        </div>
      </div>
    </main>

    <!-- スタート画面オーバーレイ（LOCK LOCKER LOCKEST） -->
    <div id="start-overlay" class="screen-overlay active">
      <div class="overlay-card bounce-in">
        <div class="hero-icon">🔐💥🔓</div>
        <h1 class="game-title">LOCK LOCKER LOCKEST</h1>
        
        <!-- ノンバーバル説明: 🔒 ➔ 🔓 ➔ +1.0s ⏱️ -->
        <div class="lock-tutorial-flow">
          <div class="tuto-flow-step">
            <span class="flow-icon">🔒</span>
          </div>
          <div class="tuto-flow-arrow">➔</div>
          <div class="tuto-flow-step">
            <span class="flow-icon">🔓</span>
          </div>
          <div class="tuto-flow-arrow">➔</div>
          <div class="tuto-flow-step reward-step">
            <span class="flow-badge">+1.0s</span>
            <span class="flow-icon">⏱️</span>
          </div>
        </div>

        <!-- 長押しSTARTボタン（3, 2, 1 カウントダウン） -->
        <button id="start-btn" class="pop-btn primary-btn hold-start-btn">
          <div class="hold-progress-fill" id="hold-progress-fill"></div>
          <div class="hold-content" id="hold-content">
            <span class="hold-icon">👆</span>
            <span class="hold-label">HOLD TO START</span>
          </div>
          <div class="hold-countdown-box" id="hold-countdown-box" style="display: none;">
            <span class="hold-num" id="hold-countdown-num">3</span>
          </div>
        </button>

        <button id="start-debug-btn" class="debug-start-link">🛠️ DEBUG MODE</button>
      </div>
    </div>

    <!-- リザルト画面オーバーレイ -->
    <div id="result-overlay" class="screen-overlay">
      <div class="overlay-card pop-up">
        <div id="result-rank-badge" class="rank-badge">RANK S</div>
        <h2 id="result-title" class="result-title">TIME'S UP!</h2>
        <div id="result-title-comment" class="result-comment">🏆</div>

        <div class="result-stats">
          <div class="stat-row">
            <span>SCORE:</span>
            <strong id="final-score" class="highlight-val">0</strong>
          </div>
          <div class="stat-row">
            <span>UNLOCKED:</span>
            <strong id="final-locks">0</strong>
          </div>
          <div class="stat-row">
            <span>HIGH SCORE:</span>
            <strong id="high-score">0</strong>
          </div>
        </div>

        <button id="retry-btn" class="pop-btn primary-btn">RETRY 🔄</button>
      </div>
    </div>

    <!-- デバッグパネル -->
    <div id="debug-panel" class="debug-panel">
      <div class="debug-header">
        <span class="debug-title">🛠️ DEBUG PANEL</span>
        <button id="debug-close-btn" class="debug-close">✕</button>
      </div>
      <div class="debug-controls">
        <div class="debug-row">
          <select id="debug-level-select"></select>
          <button id="debug-jump-btn" class="debug-action-btn primary">JUMP 🚀</button>
        </div>
        <div class="debug-row-btns">
          <button id="debug-pass-btn" class="debug-action-btn">PASS 🔓</button>
          <button id="debug-freeze-btn" class="debug-action-btn">FREEZE ⏱️</button>
          <button id="debug-add-time-btn" class="debug-action-btn">+10s ⏳</button>
          <button id="debug-gameover-btn" class="debug-action-btn danger">END 💀</button>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
