<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🔐 LOCK LOCKER LOCKEST 🔓</title>
  <link rel="stylesheet" href="style.css?v=lockest_6">
</head>
<body>
  <!-- 背景パーティクル & メカニカル鍵背景 -->
  <canvas id="particle-canvas"></canvas>
  <div id="lock-mechanism-bg">
    <div class="mech-glow-burst"></div>
    <div class="mech-bolt bolt-left"></div>
    <div class="mech-bolt bolt-right"></div>
    <div class="mech-cylinder-ring outer"></div>
    <div class="mech-cylinder-ring mid"></div>
    <div class="mech-cylinder-ring inner"></div>
    <div class="mech-keyhole-shadow"></div>
  </div>
  <div id="danger-vignette"></div>
  <div id="screen-flash-overlay"></div>

  <!-- 残り3,2,1秒 緊迫感パルスオーバーレイ (90%透過ダークレッド & 脈動カウント) -->
  <div id="urgent-countdown-overlay" class="urgent-countdown-overlay">
    <div id="urgent-count-num" class="urgent-count-num">3</div>
  </div>

  <div id="game-app">
    <!-- ヘッダーHUD -->
    <header id="hud">
      <div class="hud-item timer-box">
        <span class="hud-label">TIME</span>
        <span id="time-display" class="hud-value">18.0</span>
        <span id="time-added-anim" class="time-bonus">+1.0s</span>
      </div>
      <div class="hud-item score-box">
        <span class="hud-label">SCORE</span>
        <span id="score-display" class="hud-value">0</span>
      </div>
      <div class="hud-item unlocked-box">
        <span class="hud-label">UNLOCKED</span>
        <span id="unlocked-count" class="hud-value">0</span>
      </div>
      <div class="hud-btn-group">
        <button id="sound-btn" class="icon-btn" aria-label="Sound Toggle">🔊</button>
        <button id="debug-btn" class="icon-btn" aria-label="Debug Panel">🛠️</button>
      </div>
    </header>

    <!-- 鍵スタックエリア（立体カード構造） -->
    <main id="lock-stage">
      <!-- 背後の鍵（次の鍵：少し薄く、小さく奥にスタンバイ） -->
      <div id="next-lock-card" class="lock-card preview-card">
        <div class="card-shackle"></div>
        <div class="card-body">
          <div class="card-badge" id="next-lock-badge">NEXT</div>
        </div>
      </div>

      <!-- 手前の鍵（今解く鍵：アクティブ） -->
      <div id="current-lock-card" class="lock-card active-card">
        <div class="card-shackle" id="current-shackle"></div>
        <div class="card-body">
          <div class="lock-header">
            <span id="lock-level-badge" class="level-badge">Lv.1</span>
            <span id="lock-difficulty" class="difficulty-stars">★☆☆☆☆</span>
          </div>

          <!-- ギミック操作エリア（ピクトグラム・図形による直感UI） -->
          <div id="gimmick-container" class="gimmick-area">
            <!-- JavaScriptで言語不要の直感ギミックUIを挿入 -->
          </div>
        </div>
      </div>
    </main>

    <!-- スタート画面オーバーレイ（洗練されたプレミアムアーケードUI） -->
    <div id="start-overlay" class="screen-overlay active">
      <div class="overlay-card bounce-in title-card-premium">
        <div class="title-emblem-wrap">
          <div class="title-lock-ring"></div>
          <svg class="title-lock-svg" viewBox="0 0 80 90" width="60" height="68">
            <defs>
              <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#b2bec3" />
                <stop offset="50%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#636e72" />
              </linearGradient>
              <linearGradient id="goldBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ffeaa7" />
                <stop offset="35%" stop-color="#fed330" />
                <stop offset="80%" stop-color="#f39c12" />
                <stop offset="100%" stop-color="#d35400" />
              </linearGradient>
              <filter id="lockGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(243, 156, 18, 0.4)"/>
              </filter>
            </defs>
            <!-- シャックル (U字の掛け金) -->
            <path d="M 23 44 V 24 C 23 13 30 6 40 6 C 50 6 57 13 57 24 V 44" 
                  fill="none" stroke="url(#shackleGrad)" stroke-width="10" stroke-linecap="round" />
            <path d="M 23 44 V 24 C 23 13 30 6 40 6 C 50 6 57 13 57 24 V 44" 
                  fill="none" stroke="#2d3436" stroke-width="2" stroke-linecap="round" opacity="0.25" />
            <!-- 鍵本体 (ボディ) -->
            <rect x="12" y="38" width="56" height="46" rx="10" fill="url(#goldBodyGrad)" stroke="#2d3436" stroke-width="3" filter="url(#lockGlow)"/>
            <!-- ハイライト -->
            <rect x="16" y="42" width="48" height="5" rx="2.5" fill="#ffffff" opacity="0.45"/>
            <!-- 鍵穴 -->
            <circle cx="40" cy="57" r="5" fill="#2d3436" />
            <polygon points="37.5,59 42.5,59 41.5,72 38.5,72" fill="#2d3436" />
          </svg>
        </div>
        <h1 class="game-title title-logo-glow">LOCK LOCKER LOCKEST</h1>
        <div class="title-subtitle-badge">ULTIMATE SPEED PUZZLE</div>
        
        <!-- ノンバーバル説明: 単一枠内のシームレスなステップ表示（二重枠を廃止） -->
        <div class="lock-tutorial-bar">
          <div class="tuto-flow-item">
            <svg class="tuto-lock-svg" viewBox="0 0 24 24" width="22" height="22">
              <rect x="4" y="10" width="16" height="12" rx="3" fill="#ffa502" stroke="#2f3542" stroke-width="2"/>
              <path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="#747d8c" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="12" cy="15" r="1.8" fill="#2f3542"/>
            </svg>
          </div>
          <span class="tuto-arrow">➔</span>
          <div class="tuto-flow-item">
            <svg class="tuto-lock-svg" viewBox="0 0 24 24" width="22" height="22">
              <rect x="4" y="10" width="16" height="12" rx="3" fill="#2ed573" stroke="#2f3542" stroke-width="2"/>
              <path d="M7 10V7a5 5 0 0 1 10 0" fill="none" stroke="#747d8c" stroke-width="2.5" stroke-linecap="round"/>
              <circle cx="12" cy="15" r="1.8" fill="#2f3542"/>
            </svg>
          </div>
          <span class="tuto-arrow">➔</span>
          <div class="tuto-flow-item tuto-reward">
            <span class="reward-plus">+1.0s</span>
            <svg class="tuto-timer-svg" viewBox="0 0 24 24" width="20" height="20">
              <circle cx="12" cy="13" r="8" fill="#ffffff" stroke="#2f3542" stroke-width="2"/>
              <path d="M12 9v4l3 2" fill="none" stroke="#2f3542" stroke-width="2" stroke-linecap="round"/>
              <path d="M10 2h4M12 2v3" stroke="#2f3542" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

        <!-- 長押しSTARTボタン（指アイコン削除、アニメーショングラデーション背景） -->
        <button id="start-btn" class="pop-btn primary-btn hold-start-btn" type="button">
          <div class="hold-progress-fill" id="hold-progress-fill"></div>
          <div class="hold-inner-wrap">
            <div class="hold-idle-state" id="hold-idle-state">
              <span class="hold-label">HOLD TO START</span>
            </div>
            <div class="hold-active-state" id="hold-active-state">
              <span class="hold-countdown-num" id="hold-countdown-num">3</span>
            </div>
          </div>
        </button>

        <button id="start-debug-btn" class="debug-start-link">🛠️ DEBUG MODE</button>
      </div>
    </div>

    <!-- リザルト画面オーバーレイ（絵文字削除・タイトル戻るボタン） -->
    <div id="result-overlay" class="screen-overlay">
      <div class="overlay-card pop-up">
        <div id="result-rank-badge" class="rank-badge">RANK S</div>
        <h2 id="result-title" class="result-title">TIME'S UP!</h2>
        <div id="result-title-comment" class="result-comment" style="display: none;"></div>

        <div class="result-stats">
          <div class="stat-row">
            <span>SCORE:</span>
            <strong id="final-score" class="highlight-val">0</strong>
          </div>
          <div class="stat-row">
            <span>UNLOCKED:</span>
            <strong id="final-locks">0</strong>
          </div>
          <div class="stat-row">
            <span>HIGH SCORE:</span>
            <strong id="high-score">0</strong>
          </div>
        </div>

        <button id="retry-btn" class="pop-btn primary-btn">TITLE 🏠</button>
      </div>
    </div>

    <!-- デバッグパネル -->
    <div id="debug-panel" class="debug-panel">
      <div class="debug-header">
        <span class="debug-title">🛠️ DEBUG PANEL</span>
        <button id="debug-close-btn" class="debug-close">✕</button>
      </div>
      <div class="debug-controls">
        <div class="debug-row">
          <select id="debug-level-select"></select>
          <button id="debug-jump-btn" class="debug-action-btn primary">JUMP 🚀</button>
        </div>
        <div class="debug-row-btns">
          <button id="debug-pass-btn" class="debug-action-btn">PASS 🔓</button>
          <button id="debug-freeze-btn" class="debug-action-btn">FREEZE ⏱️</button>
          <button id="debug-add-time-btn" class="debug-action-btn">+10s ⏳</button>
          <button id="debug-gameover-btn" class="debug-action-btn danger">END 💀</button>
        </div>
      </div>
    </div>
  </div>

  <script src="main.js?v=lockest_6"></script>
</body>
</html>
