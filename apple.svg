<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- ドロップシャドウフィルター -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#7a001a" flood-opacity="0.32" />
    </filter>
    <filter id="leaf-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#0f381e" flood-opacity="0.3" />
    </filter>
    <filter id="stem-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.25" />
    </filter>

    <!-- ヘタ（茎）グラデーション -->
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#935727" />
      <stop offset="100%" stop-color="#542e0c" />
    </linearGradient>

    <!-- リンゴ本体のメイングラデーション -->
    <linearGradient id="apple-main" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ff5263" />
      <stop offset="35%" stop-color="#f02443" />
      <stop offset="75%" stop-color="#d61138" />
      <stop offset="100%" stop-color="#a30528" />
    </linearGradient>

    <!-- 上部ハイライトグラデーション -->
    <linearGradient id="apple-highlight" x1="30%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 葉っぱのグラデーション -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fe381" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
  </defs>

  <!-- 1. ヘタ（茎） -->
  <path d="M32 20 C32 15, 34 8, 39 6 C38.2 6.5, 37.5 8.5, 37.2 11 C36.8 14.5, 34.5 19, 32 20 Z" 
        fill="url(#stem-grad)" 
        filter="url(#stem-shadow)" />

  <!-- 2. リンゴ本体（シャドウ付き） -->
  <path d="M32 22
           C27 16.5, 12 16.5, 10 29
           C8 40, 15 54, 25 57
           C28.5 58, 30.5 56.5, 32 56.5
           C33.5 56.5, 35.5 58, 39 57
           C49 54, 56 40, 54 29
           C52 16.5, 37 16.5, 32 22 Z"
        fill="url(#apple-main)"
        filter="url(#soft-shadow)" />

  <!-- 3. 上部〜左側のグロス・ハイライト（Fluent特有の質感） -->
  <path d="M32 22.8
           C27.5 17.8, 14 17.8, 12 29
           C10.8 36, 14 46, 21 51
           C18 43, 17 29, 28 23
           C30 22, 31.2 22.3, 32 22.8 Z"
        fill="url(#apple-highlight)" />

  <!-- 4. 葉っぱ -->
  <path d="M33 19
           C37 13, 49 11, 51 12
           C51.5 16, 47 23, 40 23
           C36 23, 33.5 20.5, 33 19 Z"
        fill="url(#leaf-grad)"
        filter="url(#leaf-shadow)" />

  <!-- 葉の微細なハイライトライン -->
  <path d="M34.5 19 C39 15.5 46 13.5 49 12.8" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        stroke-linecap="round" 
        stroke-opacity="0.45" 
        fill="none" />
</svg>
